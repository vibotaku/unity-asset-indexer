[project]
name = "unity-asset-index"
version = "0.1.0"
description = "Index .unitypackage libraries so individual assets (and their dependencies) can be searched and extracted without importing whole packages."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.2"]

[project.scripts]
uai = "uai.cli:main"
uai-mcp = "uai.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["uai"]
