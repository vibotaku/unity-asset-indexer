[package]
name = "uai"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "Index .unitypackage libraries so individual assets (and their dependencies) can be searched, previewed and extracted without importing whole packages."
license = "MIT"
repository = "https://github.com/vibotaku/unity-asset-indexer"
readme = "README.md"
keywords = ["unity", "unitypackage", "assets", "indexer"]
categories = ["command-line-utilities", "game-development"]

[[bin]]
name = "uai"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
rusqlite = { version = "0.40", features = ["bundled"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
tar = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
walkdir = "2"
filetime = "0.2"
dirs = "7"
tempfile = "3"
ureq = { version = "3", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "io-std", "signal", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
axum = { version = "0.8", features = ["json", "query", "http1", "tokio"] }
tower-http = { version = "0.7", features = ["cors"] }
futures-util = "0.3"

[dev-dependencies]
assert_cmd = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
